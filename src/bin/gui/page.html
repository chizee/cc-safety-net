<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CC Safety Net Policy</title>
  <script>
    (() => {
      const stored = localStorage.getItem('cc-safety-net-theme');
      if (stored === 'light' || stored === 'dark') document.documentElement.style.colorScheme = stored;
    })();
  </script>
  <style>
/* __CC_SAFETY_NET_CUSTOM_CSS__ */
  </style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="titlewrap">
        <h1>CC Safety Net Policy</h1>
        <div id="policy-path"></div>
      </div>
      <div class="actions">
        <button type="button" id="theme-toggle"></button>
        <button class="primary" id="save">Save</button>
        <button class="danger" id="reset">Reset</button>
      </div>
    </div>
  </header>
  <main>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="muted" id="reset-confirmation"></div>
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <h2>Modes</h2>
          <p class="panel-sub muted">Global posture toggles that widen or tighten protection coverage.</p>
        </div>
      </div>
      <div class="grid" id="modes"></div>
    </section>
    <section class="panel foldable">
      <div class="panel-head">
        <div class="panel-title">
          <h2><button class="panel-toggle" type="button" aria-expanded="true" aria-controls="builtins-panel-content"><span class="panel-chevron" aria-hidden="true"></span><span>Built-in Protections</span></button></h2>
          <p class="panel-sub muted" id="builtins-summary"></p>
        </div>
        <label class="search">
          <span>Search protections</span>
          <input type="search" id="builtin-search" autocomplete="off" placeholder="Filter by name, category, or rule ID">
        </label>
      </div>
      <div id="builtins-panel-content">
        <div id="builtins"></div>
      </div>
    </section>
    <section class="panel foldable">
      <header class="panel-head">
        <div class="panel-title">
          <h2><button class="panel-toggle" type="button" aria-expanded="true" aria-controls="secret-panel-content"><span class="panel-chevron" aria-hidden="true"></span><span>Secret Protection</span></button></h2>
          <p class="panel-sub muted" id="secret-summary">Default secret patterns can be disabled individually. Deny paths are always blocked.</p>
        </div>
        <label class="search">
          <span>Search secret patterns</span>
          <input type="search" id="secret-search" autocomplete="off" placeholder="Filter by name, category, or rule ID">
        </label>
      </header>
      <div id="secret-panel-content">
        <div id="secret"></div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <h2>Raw JSON</h2>
          <p class="panel-sub muted" id="raw-source">Raw JSON mirrors the controls until you edit it.</p>
        </div>
      </div>
      <textarea id="raw" aria-label="Raw policy JSON" aria-describedby="raw-source"></textarea>
    </section>
  </main>
  <script>
    const token = __CC_SAFETY_NET_TOKEN__;
    const modeLabels = {
      strict: ['Strict', 'Fail closed on unparseable commands.'],
      paranoid: ['Paranoid', 'Enable all paranoid checks.'],
      paranoid_rm: ['Paranoid rm -rf checks', 'Block non-temp rm -rf within cwd.'],
      paranoid_interpreters: ['Paranoid interpreters', 'Block interpreter one-liners.'],
      worktree_mode: ['Worktree mode', 'Allow local git discards in linked worktrees.']
    };
    let state;
    let draftPolicy;
    let rawIsManual = false;
    let resetArmed = false;
    let syncingRaw = false;
    const api = (path, init = {}) => fetch(`${path}?token=${encodeURIComponent(token)}`, {
      ...init,
      headers: { 'content-type': 'application/json', 'x-cc-safety-net-token': token, ...(init.headers || {}) }
    });
    const qs = (id) => document.getElementById(id);
    const setStatus = (text, kind = '') => {
      qs('status').textContent = text;
      qs('status').className = `status ${kind}`;
    };
    const checkbox = (checked) => checked ? 'checked' : '';
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);
    const clonePolicy = (policy) => JSON.parse(JSON.stringify(policy));
    const pathLines = (value) => value.split('\n').map((line) => line.trim()).filter(Boolean);
    const formatPolicy = (policy) => `${JSON.stringify(policy, null, 2)}\n`;
    const collectFormPolicy = () => ({
      version: 1,
      modes: draftPolicy.modes,
      builtins: draftPolicy.builtins,
      secret_protection: {
        enabled: draftPolicy.secret_protection.enabled,
        overrides: draftPolicy.secret_protection.overrides,
        deny_paths: pathLines(qs('deny-paths')?.value ?? '')
      }
    });
    const disarmReset = () => {
      resetArmed = false;
      qs('reset').textContent = 'Reset';
      qs('reset-confirmation').textContent = '';
    };
    const togglePanel = (button) => {
      const content = qs(button.getAttribute('aria-controls'));
      const expanded = button.getAttribute('aria-expanded') === 'true';
      button.setAttribute('aria-expanded', String(!expanded));
      content.hidden = expanded;
    };
    const updateRawSource = () => {
      qs('raw-source').textContent = rawIsManual
        ? 'Save will use Raw JSON. Fix validation errors here or reset to defaults.'
        : 'Raw JSON mirrors the controls until you edit it.';
    };
    const syncRawFromForm = () => {
      if (rawIsManual) return;
      syncingRaw = true;
      qs('raw').value = formatPolicy(collectFormPolicy());
      syncingRaw = false;
      updateRawSource();
    };
    const updateDraftSecretPaths = () => {
      draftPolicy.secret_protection.deny_paths = pathLines(qs('deny-paths')?.value ?? '');
    };
    const groupRules = (rules) => rules.reduce((groups, rule) => {
      const group = groups.find((item) => item.category === rule.category);
      if (group) {
        group.rules.push(rule);
        return groups;
      }
      groups.push({ category: rule.category, rules: [rule] });
      return groups;
    }, []);
    const renderRuleToggles = (options) => {
      const query = qs(options.searchId).value.trim().toLowerCase();
      const rules = options.rules.filter((rule) =>
        [rule.category, rule.label, rule.id, rule.description].join(' ').toLowerCase().includes(query)
      );
      const disabledCount = Object.keys(options.overrides).length;
      qs(options.summaryId).textContent = options.summaryText(disabledCount);
      qs(options.targetId).innerHTML = rules.length === 0
        ? `<p class="empty">${escapeHtml(options.emptyText)}</p>`
        : groupRules(rules).map((group) => `
          <section class="builtin-group">
            <h3>${escapeHtml(group.category)}</h3>
            <div class="grid">${group.rules.map((rule) => {
              const active = options.overrides[rule.id] !== 'off';
              return `<label class="row">
                <input type="checkbox" ${options.dataAttribute}="${escapeHtml(rule.id)}" ${checkbox(active)}>
                <span>
                  <strong>${escapeHtml(rule.label)}</strong>
                  <small><span class="${active ? 'state-active' : 'state-disabled'}">${active ? 'Active' : 'Disabled'}</span> ${escapeHtml(rule.description)}</small>
                </span>
              </label>`;
            }).join('')}</div>
          </section>
        `).join('');
    };
    const renderBuiltins = () => renderRuleToggles({
      searchId: 'builtin-search',
      rules: state.builtins,
      overrides: draftPolicy.builtins.overrides,
      summaryId: 'builtins-summary',
      targetId: 'builtins',
      dataAttribute: 'data-builtin-active',
      emptyText: 'No built-in protections match the search.',
      summaryText: (disabledCount) =>
        `${state.builtins.length - disabledCount} active, ${disabledCount} disabled`
    });
    const renderSecretPatterns = () => {
      renderRuleToggles({
        searchId: 'secret-search',
        rules: state.secretPatterns,
        overrides: draftPolicy.secret_protection.overrides,
        summaryId: 'secret-summary',
        targetId: 'secret-patterns',
        dataAttribute: 'data-secret-active',
        emptyText: 'No secret patterns match the search.',
        summaryText: (disabledCount) =>
          `Default secret patterns: ${state.secretPatterns.length - disabledCount} active, ${disabledCount} disabled. Deny paths are always blocked.`
      });
    };
    function render() {
      draftPolicy = clonePolicy(state.policy);
      rawIsManual = state.errors.length > 0;
      disarmReset();
      qs('policy-path').textContent = state.path + (state.exists ? '' : ' (not created yet)');
      qs('modes').innerHTML = Object.entries(modeLabels).map(([key, meta]) =>
        `<label class="row"><input type="checkbox" data-mode="${key}" ${checkbox(state.policy.modes[key])}><span><strong>${meta[0]}</strong><small>${meta[1]}</small></span></label>`
      ).join('');
      qs('secret').innerHTML =
        '<label class="row"><input type="checkbox" id="secret-enabled" ' + checkbox(state.policy.secret_protection.enabled) + '><span><strong>Enable secret protection</strong><small>Use policy settings without requiring the environment flag.</small></span></label>' +
        '<div id="secret-patterns"></div>' +
        '<label class="field" for="deny-paths"><span>Deny paths</span><small>One path per line. Exact normalized paths stay blocked even when default patterns are disabled.</small></label>' +
        '<textarea id="deny-paths">' + escapeHtml(state.policy.secret_protection.deny_paths.join('\n')) + '</textarea>';
      qs('raw').value = state.errors.length ? state.raw : formatPolicy(draftPolicy);
      qs('builtin-search').value = '';
      qs('secret-search').value = '';
      renderBuiltins();
      renderSecretPatterns();
      updateRawSource();
      setStatus(
        state.errors.length ? `Error: ${state.errors.join('\n')}` : 'Status: Loaded.',
        state.errors.length ? 'error' : 'ok'
      );
    }
    function collectPolicy() {
      if (!rawIsManual) return collectFormPolicy();
      try {
        return JSON.parse(qs('raw').value.trim() || '{}');
      } catch (error) {
        setStatus(`Error: Raw JSON is invalid: ${error instanceof Error ? error.message : String(error)}`, 'error');
        return null;
      }
    }
    async function load() {
      state = await (await api('/api/policy')).json();
      render();
    }
    document.addEventListener('input', (event) => {
      const input = event.target;
      if (input.id === 'builtin-search') {
        disarmReset();
        renderBuiltins();
        return;
      }
      if (input.id === 'secret-search') {
        disarmReset();
        renderSecretPatterns();
        return;
      }
      if (input.id === 'raw') {
        if (!syncingRaw) rawIsManual = true;
        disarmReset();
        updateRawSource();
        return;
      }
      if (input.id === 'deny-paths') {
        updateDraftSecretPaths();
        disarmReset();
        syncRawFromForm();
      }
    });
    document.addEventListener('change', (event) => {
      const input = event.target;
      if (input.dataset?.mode) {
        draftPolicy.modes[input.dataset.mode] = input.checked;
        disarmReset();
        syncRawFromForm();
        return;
      }
      if (input.dataset?.builtinActive) {
        if (input.checked) delete draftPolicy.builtins.overrides[input.dataset.builtinActive];
        else draftPolicy.builtins.overrides[input.dataset.builtinActive] = 'off';
        disarmReset();
        renderBuiltins();
        syncRawFromForm();
        return;
      }
      if (input.dataset?.secretActive) {
        if (input.checked) delete draftPolicy.secret_protection.overrides[input.dataset.secretActive];
        else draftPolicy.secret_protection.overrides[input.dataset.secretActive] = 'off';
        disarmReset();
        renderSecretPatterns();
        syncRawFromForm();
        return;
      }
      if (input.id === 'secret-enabled') {
        draftPolicy.secret_protection.enabled = input.checked;
        disarmReset();
        syncRawFromForm();
      }
    });
    document.addEventListener('click', (event) => {
      const button = event.target.closest?.('.panel-toggle');
      if (button) togglePanel(button);
    });
    qs('save').onclick = async () => {
      disarmReset();
      const policy = collectPolicy();
      if (!policy) return;
      const response = await api('/api/policy', { method: 'POST', body: JSON.stringify(policy) });
      const result = await response.json();
      if (!response.ok) { setStatus(`Error: ${result.errors.join('\n')}`, 'error'); return; }
      await load();
      setStatus(`Status: Saved ${result.path}.`, 'ok');
    };
    qs('reset').onclick = async () => {
      if (!resetArmed) {
        resetArmed = true;
        qs('reset').textContent = 'Confirm reset';
        qs('reset-confirmation').textContent =
          `Reset will restore default policy JSON at ${state.path}. Click Confirm reset to continue.`;
        return;
      }
      await api('/api/reset', { method: 'POST', body: '{}' });
      await load();
      setStatus(`Status: Reset ${state.path} to defaults.`, 'ok');
    };
    const themeOrder = ['auto', 'light', 'dark'];
    const themeIcons = {
      auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M8 20h8M12 16v4"></path></svg>',
      light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg>',
      dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>'
    };
    const themeLabels = { auto: 'Auto', light: 'Light', dark: 'Dark' };
    const applyTheme = (pref) => {
      document.documentElement.style.colorScheme = pref === 'auto' ? 'light dark' : pref;
      qs('theme-toggle').innerHTML = `${themeIcons[pref]}<span>${themeLabels[pref]}</span>`;
      qs('theme-toggle').setAttribute('aria-label', `Color theme: ${themeLabels[pref]}. Click to change.`);
    };
    let themePref = themeOrder.includes(localStorage.getItem('cc-safety-net-theme'))
      ? localStorage.getItem('cc-safety-net-theme')
      : 'auto';
    applyTheme(themePref);
    qs('theme-toggle').onclick = () => {
      themePref = themeOrder[(themeOrder.indexOf(themePref) + 1) % themeOrder.length];
      if (themePref === 'auto') localStorage.removeItem('cc-safety-net-theme');
      else localStorage.setItem('cc-safety-net-theme', themePref);
      applyTheme(themePref);
    };
    load().catch((error) => setStatus(String(error), 'error'));
  </script>
</body>
</html>
