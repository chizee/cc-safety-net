pre-commit:
  piped: true
  jobs:
    - name: knip
      run: bun run knip
    - name: biome
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,json,jsonc}"
      stage_fixed: true
    - name: build
      run: bun run build && git add -A dist/

pre-push:
  jobs:
    - name: check
      run: bun run check
