name: Lint GitHub Actions Workflows

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pinned actionlint from the verified Go module
        run: go install github.com/rhysd/actionlint/cmd/actionlint@0933c147c9d6587653d45fdcb4c497c57a65f9af
      - name: Run actionlint
        run: "$(go env GOPATH)/bin/actionlint -color -shellcheck="
