name: Windows Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/cli"
      - run: bun run check:ci
      - run: bun run build
      - run: git diff --exit-code -- dist assets/cc-safety-net.schema.json
      - name: Verify Windows command behavior
        shell: pwsh
        run: |
          New-Item -ItemType Directory test-dir
          $result = bun run cc-safety-net explain --cwd test-dir "rm -rf dist" 2>&1
          if ($result -notmatch "ALLOWED") { exit 1 }
